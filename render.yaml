services:
  - type: web
    name: smart-fertilizer-advisor
    env: python
    buildCommand: pip install -r requirements.txt && python ml/train.py && python rag/build_index.py
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
